<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmera Bay: Sunset Heat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="game-root"></div>

<div id="hud" class="hidden-until-play">
  <div id="hud-top-left">
    <div id="hud-stars">☆☆☆☆☆</div>
    <div id="hud-cash">$120</div>
    <div id="hud-health"><div id="hud-health-fill"></div><span id="hud-health-text">HP 100</span></div>
  </div>
  <div id="hud-top-center">
    <div id="hud-mission">MISSION 1/5 — Hot Wheels</div>
    <div id="hud-objective">Steal a car</div>
  </div>
  <div id="hud-bottom-left">
    <div id="hud-speed">0 km/h</div>
    <div id="hud-weapon">FISTS — press 1 for pistol</div>
  </div>
  <div id="hud-bottom-right">
    <canvas id="minimap" width="168" height="168"></canvas>
  </div>
  <div id="crosshair" class="hidden">+</div>
  <div id="dialogue" class="hidden"><span id="dialogue-text"></span></div>
  <div id="toasts"></div>
  <div id="damage-flash"></div>
</div>

<div id="menu">
  <div id="menu-panel">
    <h1 id="menu-title">PALMERA BAY</h1>
    <p id="menu-text"></p>
    <div id="menu-buttons"></div>
    <p class="menu-foot">WASD move / drive · Mouse aim · Click shoot · F punch · E enter car · 1 pistol · R reload · G garage · P pause</p>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
